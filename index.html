<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>解剖学刷题本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a one-screen study desk. Left rail = chapter map + question grid; right = the current question as a single sheet. On phones the rail becomes a drawer. */
:root{
  --bg:#eef1f2; --sheet:#fbfcfc; --ink:#1a2226; --muted:#5f6d73; --line:#d5dcdf;
  --accent:#2d4f8f; --accent-soft:#e2e8f3;
  --ok:#2b7a55; --ok-soft:#e1f1e8; --bad:#b8402c; --bad-soft:#f7e3de; --star:#b7811d;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171a; --sheet:#1a2125; --ink:#e3e8ea; --muted:#93a2a8; --line:#2c373c;
  --accent:#8fb0ec; --accent-soft:#223149; --ok:#6cc79a; --ok-soft:#173528; --bad:#ee8a76; --bad-soft:#3d211b; --star:#e2b354; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171a; --sheet:#1a2125; --ink:#e3e8ea; --muted:#93a2a8; --line:#2c373c;
  --accent:#8fb0ec; --accent-soft:#223149; --ok:#6cc79a; --ok-soft:#173528; --bad:#ee8a76; --bad-soft:#3d211b; --star:#e2b354; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
/* rail */
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.brand{padding:18px 18px 10px;display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.banks{display:flex;gap:0;margin:0 18px 12px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.banks button{flex:1;border:0;background:transparent;padding:6px 8px;font-size:13px;color:var(--muted)}
.banks button[aria-pressed="true"]{background:var(--accent);color:var(--sheet);font-weight:500}
.judge{display:flex;gap:10px}
.judge .opt{flex:1;grid-template-columns:30px minmax(0,1fr) auto}
.expl{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px;line-height:1.8;white-space:pre-wrap}
.expl b{color:var(--accent);font-weight:500}
.modes{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.8}
.chlist{overflow:auto;flex:1;padding:0 10px 16px;min-height:0}
.part{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:12px 8px 4px}
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px}
.ch:hover{background:var(--accent-soft)}
.ch[aria-current="true"]{background:var(--sheet);box-shadow:0 0 0 1px var(--line)}
.ch b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch small{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:center}
.bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .r{background:var(--ok)}.bar .w{background:var(--bad)}
/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.menu{display:none;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px}
.crumb{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:0;flex:1}
.crumb small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.stage{flex:1;overflow:auto;padding:24px 20px 32px;min-height:0}
.sheet{max-width:760px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px 22px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 9px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.qno{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qhead .sp{flex:1}
.icon{border:1px solid var(--line);background:transparent;border-radius:7px;padding:2px 10px;font-size:13px;color:var(--muted)}
.icon[aria-pressed="true"]{color:var(--star);border-color:var(--star)}
.icon.mark[aria-pressed="true"]{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.exp textarea{flex:1;min-height:0;margin:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.7 var(--f-body);resize:none}
.exp .vbox{height:min(760px,100%)}
.exp .msg{font-size:13px;color:var(--ok)}
.icon.note[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.notebox{margin-top:18px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--bg)}
.notebox h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:500;display:flex;gap:8px;align-items:center}
.notebox h4 .sp{flex:1}
.notebox .txt{white-space:pre-wrap;word-break:break-word;line-height:1.8}
.notebox textarea{width:100%;box-sizing:border-box;min-height:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);font:15px/1.7 var(--f-body);resize:vertical}
.notebox .hint{font-size:12px;color:var(--muted);margin-top:4px}
.notebox .tools{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.notebox .tools .btn{padding:3px 10px;font-size:13px}
.notebox .tools .btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.notebox textarea.drag{border-color:var(--accent);background:var(--accent-soft)}
.md{line-height:1.8;word-break:break-word}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 8px}
.md h3,.md h4,.md h5{margin:10px 0 6px;font-family:var(--f-display);font-weight:600;color:var(--ink)}
.md h3{font-size:17px}.md h4{font-size:15.5px}.md h5{font-size:14.5px}
.md ul,.md ol{margin:0 0 8px;padding-left:1.5em}
.md li{margin:2px 0}
.md blockquote{margin:0 0 8px;padding:2px 0 2px 10px;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;margin:0 0 8px}
.md pre code{border:0;padding:0;background:none}
.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.md a{color:var(--accent)}
.md .tbl{overflow-x:auto;margin:0 0 8px}
.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.md th{background:var(--sheet);font-weight:500}
.md img{max-width:100%;max-height:420px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;margin:6px 0}
.md .imgmiss{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 8px;margin:4px 0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.linkbtn{border:0;background:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--accent)}
.case{font-size:15px;line-height:1.75;color:var(--muted,inherit);border-left:3px solid var(--line,currentColor);padding:2px 0 2px 12px;margin:0 0 12px;white-space:pre-wrap}
.stem{font-size:18px;line-height:1.8;margin:0 0 18px;white-space:pre-wrap;word-break:break-word}
.stem .blank{display:inline-block;min-width:4.5em;border-bottom:1.5px solid var(--ink);text-align:center;padding:0 4px;margin:0 2px;line-height:1.4}
.stem .blank.on{color:var(--ok);font-weight:500;border-color:var(--ok)}
.fig{margin:0 0 16px;text-align:center}
.fig img{max-height:320px;border-radius:6px;background:#fff;padding:6px;border:1px solid var(--line)}
.fig figcaption{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:9px;padding:10px 12px;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .mk{font-size:13px;font-weight:500}
.opt.right .mk{color:var(--ok)}.opt.wrong .mk{color:var(--bad)}
.verdict{margin-top:16px;padding:10px 14px;border-radius:9px;font-weight:500;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict .ans{font-family:var(--f-mono)}
.answer{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;white-space:pre-wrap;line-height:1.85;word-break:break-word}
.answer h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:500}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 16px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:500}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.nav{display:flex;align-items:center;gap:10px;max-width:760px;margin:16px auto 0;flex-wrap:wrap}
.nav .sp{flex:1}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.grid{max-width:760px;margin:22px auto 0;display:flex;flex-wrap:wrap;gap:5px}
.gridnav{max-width:760px;margin:8px auto 0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.gsec{width:100%;font-size:12px;color:var(--muted);margin-top:8px}
.cell{width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);font-family:var(--f-mono);font-size:12px;padding:0}
.cell.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.empty{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:22px}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
/* page viewer */
.viewer{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.vbox{background:var(--sheet);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}
.vbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vbar .sp{flex:1}
.vbox.two{width:min(1500px,100%)}
.vgrid{flex:1 1 auto;min-height:0;overflow:auto;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;align-content:flex-start}
.vpane{flex:1 1 420px;background:var(--sheet);display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vhead{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vhead .sp{flex:1}
.vhead .tag.ans{background:var(--ok-soft);color:var(--ok)}
.chip:disabled{opacity:.4;cursor:default}
.vt{font-family:var(--f-display);font-weight:600}
.vimg{padding:8px;text-align:center}
.vimg img{width:100%;max-width:760px;background:#fff;border-radius:4px}
.sync{font-size:11px;color:var(--muted);padding:8px 18px 14px;border-top:1px solid var(--line)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:15;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .rail.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .menu{display:inline-block}
  .sheet{padding:20px 16px 18px}
  .stem{font-size:17px}
  .stage{padding:16px 16px 28px}
  .top{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><h1>解剖学刷题本</h1><span id="bankSub">人体解剖学应试指南</span></div>

<script>
const CHOICE={A1:1,A2:1,A3:1,A4:1,B:1,X:1};
const TYPE_LABEL={A1:'A1型 单选',A2:'A2型 病例单选',A3:'A3型',A4:'A4型',B:'B型 配伍',X:'X型 多选','填空题':'填空','判断题':'判断','名词解释':'名词解释','问答题':'问答','病例分析':'病例分析'};
const FILTERS=[['all','全部',()=>true],['choice','选择',i=>CHOICE[i.t]],['fill','填空',i=>i.t==='填空题'],['judge','判断',i=>i.t==='判断题'],['term','名词解释',i=>i.t==='名词解释'],['essay','问答/病例',i=>i.t==='问答题'||i.t==='病例分析']];
const L='ABCDE';
const BANKS=[
  {id:'zn',name:'应试指南',sub:'人体解剖学应试指南',src:()=>window.QUIZ_DATA,key:'anat-progress',vkey:'anat-view',pages:'pages',maxp:380,pageLabel:'原书'},
  {id:'3k',name:'三千题',sub:'系统解剖学题库（一）',src:()=>window.QUIZ_DATA_3K,key:'anat3k-progress',vkey:'anat3k-view',pages:'pages3k',maxp:250,pageLabel:'题库'}];
let BANK=BANKS[0];
let D=null, ALL=[], figMap={};
let S={d:{},w:{},s:{},m:{},n:{},u:{},ts:0};       // u 保存每个题目字段最近一次修改时间
const MEM={};
const LOADED_BANKS=new Set();
const MEM_VIEWS={};
const BAD_KEYS=new Set();
let storageFailed=false;
let storageNotice='';
let V={view:'ch',ch:0,filter:'all',idx:0,order:'seq',seed:1,currentId:null};
let list=[], pick=new Set(), revealed=false, judged=null, editingNote=false, expKind='mark';

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(key){
  try{return JSON.parse(localStorage.getItem(key)||'null')}
  catch(error){
    BAD_KEYS.add(key);
    storageFailed=true;
    storageNotice=`无法读取本机记录「${key}」。原数据已保留，请下载当前内存备份后再恢复。`;
    syncMsg(storageNotice);
    return null;
  }
}
function lsSet(key,value){
  if(BAD_KEYS.has(key)){
    storageFailed=true;
    storageNotice=`本机记录「${key}」无法解析，已停止覆盖。当前记录仍保留在内存中，请下载备份。`;
    syncMsg(storageNotice);
    return false;
  }
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch(error){
    storageFailed=true;
    storageNotice='浏览器存储失败。当前记录仍保留在页面内存中，请立即下载备份。';
    syncMsg(storageNotice);
    return false;
  }
}

/* ---------- persistence: this browser only (localStorage) ---------- */
function save(){S.ts=Date.now();MEM[BANK.id]=S;return lsSet(BANK.key,S)}

/* ---------- data ---------- */
async function load(){
  if(!window.QUIZ_DATA){try{const r=await fetch('data.json');window.QUIZ_DATA=await r.json()}catch(e){}}
  const want=lsGet('anat-bank');
  useBank(BANKS.find(b=>b.id===want&&b.src())||BANKS.find(b=>b.src()));
}
function useBank(b){
  if(BANK&&LOADED_BANKS.has(BANK.id))MEM[BANK.id]=S;
  BANK=b; lsSet('anat-bank',b.id);
  D=b.src(); ALL=[]; figMap={};
  (D.figs||[]).forEach(f=>figMap[f.id]=f);
  D.chapters.forEach((c,ci)=>c.items.forEach(it=>{it.ci=ci;it.id=ci+'|'+it.t+'|'+it.n;ALL.push(it)}));
  S={d:{},w:{},s:{},m:{},n:{},u:{},ts:0};
  const saved=LOADED_BANKS.has(b.id)?MEM[b.id]:lsGet(b.key); if(saved&&saved.d)S={...S,...saved}; S.m=S.m||{}; S.n=S.n||{}; S.u=S.u||{};

function buildList(keepIdx){

  let src;
  if(V.view==='wrong') src=ALL.filter(i=>S.w[i.id]&&S.d[i.id]!==1);
  else if(V.view==='star') src=ALL.filter(i=>S.s[i.id]);
  else if(V.view==='mark') src=ALL.filter(i=>S.m[i.id]);
  else if(V.view==='note') src=ALL.filter(i=>S.n[i.id]);
  else src=D.chapters[V.ch].items;
  list=src.filter(f);
  if(V.order==='rand'){list=list.slice();let state=(Number(V.seed)||1)>>>0;const rand=()=>{state=(state+0x6D2B79F5)>>>0;let t=state;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296};for(let i=list.length-1;i>0;i--){const j=rand()*(i+1)|0;[list[i],list[j]]=[list[j],list[i]]}}
  if(!keepIdx)V.idx=0;
  if(V.idx>=list.length)V.idx=Math.max(0,list.length-1);
  if(oldId){const same=list.findIndex(i=>i.id===oldId);if(same>=0)V.idx=same}
  V.currentId=list[V.idx]&&list[V.idx].id||null;

}

/* ---------- tiny markdown renderer (no external library, works offline) ---------- */
function mdInline(s){
  // s is already HTML-escaped
  const codes=[]; s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return `\u0000${codes.length-1}\u0000`});
  s=s.replace(/!\[([^\]]*)\]\(img:([A-Za-z0-9_-]+)\)/g,(m,alt,id)=>`<img data-img="${id}" alt="${alt}">`);
  s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,(m,alt,u)=>`<img src="${u}" alt="${alt}">`);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+?)~~/g,'<del>$1</del>');
  s=s.replace(/==([^=]+?)==/g,'<mark>$1</mark>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codes[+i]}</code>`);
}
function md(src){
  if(!src)return '';
  const L=esc(src).split(/\r?\n/); let out='',i=0;
  const isTblSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>mdInline(c.trim()));
  while(i<L.length){
    let l=L[i];
    if(/^\s*```/.test(l)){let b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;out+=`<pre><code>${b.join('\n')}</code></pre>`;continue}
    if(!l.trim()){i++;continue}
    let m=l.match(/^(#{1,6})\s+(.*)$/); if(m){const n=Math.min(5,m[1].length+2);out+=`<h${n}>${mdInline(m[2])}</h${n}>`;i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out+='<hr>';i++;continue}
    if(l.includes('|')&&i+1<L.length&&isTblSep(L[i+1])){
      const head=cells(l);i+=2;let rows=[];while(i<L.length&&L[i].includes('|')&&L[i].trim())rows.push(cells(L[i++]));
      out+=`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
    if(/^\s*&gt;\s?/.test(l)){let b=[];while(i<L.length&&/^\s*&gt;\s?/.test(L[i]))b.push(L[i++].replace(/^\s*&gt;\s?/,''));out+=`<blockquote>${md(b.join('\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'))}</blockquote>`;continue}
    if(/^\s*[-*+]\s+/.test(l)){let b=[];while(i<L.length&&/^\s*[-*+]\s+/.test(L[i]))b.push(L[i++].replace(/^\s*[-*+]\s+/,''));out+=`<ul>${b.map(x=>`<li>${mdInline(x)}</li>`).join('')}</ul>`;continue}
    if(/^\s*\d+[.)、]\s*/.test(l)&&/^\s*\d+[.)]\s+/.test(l)){let b=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))b.push(L[i++].replace(/^\s*\d+[.)]\s+/,''));out+=`<ol>${b.map(x=>`<li>${mdInline(x)}</li>`).join('')}</ol>`;continue}
    let b=[];while(i<L.length&&L[i].trim()&&!/^(#{1,6})\s|^\s*```|^\s*&gt;|^\s*[-*+]\s+|^\s*\d+[.)]\s+/.test(L[i])&&!(L[i].includes('|')&&i+1<L.length&&isTblSep(L[i+1])))b.push(mdInline(L[i++]));
    if(!b.length){b.push(mdInline(L[i++]))}
    out+=`<p>${b.join('<br>')}</p>`;
  }
  return out;
}

/* ---------- note images: IndexedDB (big quota, local only) ---------- */
let idbP=null; const imgURL={};
function idb(){
  if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('anat-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  return idbP;
}
async function imgPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('img','readwrite');t.objectStore('img').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function imgGet(id){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('img').objectStore('img').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function hydrateImgs(root){
  for(const el of (root||document).querySelectorAll('img[data-img]:not([src])')){
    const id=el.dataset.img;
    try{
      if(!imgURL[id]){const b=await imgGet(id);if(b)imgURL[id]=URL.createObjectURL(b)}
      if(imgURL[id])el.src=imgURL[id];
      else el.outerHTML=`<span class="imgmiss">图片不在这台设备上（可用「恢复」导入含图片的备份）</span>`;
    }catch(e){el.outerHTML=`<span class="imgmiss">这个浏览器无法读取本地图片</span>`}
  }
}
async function compressImg(file){
  const bmp=await createImageBitmap(file); const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  let b=await new Promise(r=>c.toBlob(r,'image/webp',.82));
  if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
  return b;
}
function supportedImage(file){return !!file&&['image/png','image/jpeg','image/webp','image/gif'].includes(String(file.type||'').toLowerCase())}
async function addImages(files){
  const it=list[V.idx], ta=$('noteTa'), bankId=BANK.id; if(!it||!ta)return;
  const imgs=[...files].filter(supportedImage); if(!imgs.length){if($('noteMsg'))$('noteMsg').textContent='只支持 PNG、JPEG、WebP 或 GIF 图片';return}
  $('noteMsg').textContent='正在处理图片…';
  let ins='';
  for(const f of imgs){
    try{const b=await compressImg(f); const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await imgPut(id,b); imgURL[id]=URL.createObjectURL(b); ins+=`\n![图](img:${id})\n`;
    }catch(e){if($('noteMsg'))$('noteMsg').textContent='图片保存失败：这个浏览器可能不允许本地存图';return}
  }
  if(BANK.id!==bankId||!list[V.idx]||list[V.idx].id!==it.id||$('noteTa')!==ta){syncMsg('图片已保存，但当前题目已切换。图片没有插入其他题目的注释。');return}
  const a=ta.selectionStart,z=ta.selectionEnd; ta.value=ta.value.slice(0,a)+ins+ta.value.slice(z);
  ta.selectionStart=ta.selectionEnd=a+ins.length; ta.focus(); setNote(it,ta.value);
  $('noteMsg').textContent=`已插入 ${imgs.length} 张图片，点「预览」查看`;
}

function openNoteEditor(){editingNote=true;notePreview=false;renderStage();const ta=$('noteTa');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ta.scrollIntoView({block:'nearest'})}}

function selfAssess(it){

}

/* ---------- backup / restore (a JSON file the user keeps) ---------- */
function syncMsg(t){$('syncMsg').textContent=storageFailed?storageNotice:t}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function dataImageBlob(value){
  const match=String(value||'').match(/^data:(image\/(?:png|jpeg|webp|gif));base64,([A-Za-z0-9+/]+={0,2})$/i);
  if(!match)return null;
  try{
    const binary=atob(match[2]);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new Blob([bytes],{type:match[1].toLowerCase()});
  }catch(error){
    return null;
  }
}
function mergeProgress(local,incoming){
  const fields=['d','w','s','m','n'];
  const out={...local,u:{...(local.u||{})}};
  fields.forEach(field=>{out[field]={...(local[field]||{})}});

  for(const field of fields){
    const localTimes=(local.u||{})[field]||{};
    const incomingTimes=(incoming.u||{})[field]||{};
    out.u[field]={...localTimes};
    const incomingValues=incoming[field]||{};

    for(const id of Object.keys(incomingValues)){
      const hasLocal=Object.hasOwn(out[field],id);
      const hasLocalTime=Object.hasOwn(localTimes,id);
      const hasIncomingTime=Object.hasOwn(incomingTimes,id);
      const localTime=hasLocalTime?Number(localTimes[id]):hasLocal?Number(local.ts||0):0;
      const incomingTime=hasIncomingTime?Number(incomingTimes[id]):Number(incoming.ts||0);

      if(!hasLocal||incomingTime>localTime){
        out[field][id]=incomingValues[id];
        out.u[field][id]=incomingTime;
      }
    }
  }

  out.ts=Math.max(Number(local.ts||0),Number(incoming.ts||0));
  return out;
}
function backupBanks(j){
  if(!j||typeof j!=='object'||Array.isArray(j))throw new Error('格式错误');
  if(j.app!==undefined&&j.app!=='anat-quiz')throw new Error('来源不匹配');
  if(j.v!==undefined&&(!Number.isInteger(Number(j.v))||Number(j.v)<1||Number(j.v)>4))throw new Error('版本不支持');
  if(j.saved!==undefined&&!Number.isFinite(Date.parse(j.saved)))throw new Error('备份时间错误');
  const legacy=j.progress||j.legacyprogress||j;
  let banks=j.banks||(legacy.d?{zn:legacy}:null);
  if(!banks&&(legacy.zn||legacy['3k']))banks=legacy;
  if(!banks&&j.data&&j.data.d)banks={zn:j.data};
  if(!banks||typeof banks!=='object'||Array.isArray(banks))throw new Error('缺少题库记录');
  for(const [bankId,progress] of Object.entries(banks)){
    const bank=BANKS.find(item=>item.id===bankId);
    if(!bank||!progress||typeof progress!=='object'||Array.isArray(progress))throw new Error('题库结构错误');
    const ids=new Set();
    bank.src().chapters.forEach((chapter,chapterIndex)=>chapter.items.forEach(item=>{
      ids.add(`${chapterIndex}|${item.t}|${item.n}`);
    }));

    for(const field of ['d','w','s','m','n']){
      const values=progress[field];
      if(values===undefined)continue;
      if(!values||typeof values!=='object'||Array.isArray(values))throw new Error('记录字段错误');
      for(const [id,value] of Object.entries(values)){
        if(!ids.has(id))throw new Error('题目编号不属于题库');
        if(field==='d'&&value!==0&&value!==1)throw new Error('答题记录错误');
        if(field==='w'&&(typeof value!=='number'||!Number.isFinite(value)||value<0))throw new Error('错题次数错误');
        if((field==='s'||field==='m')&&![0,1,false,true].includes(value))throw new Error('标记记录错误');
        if(field==='n'&&typeof value!=='string')throw new Error('注释记录错误');
      }
    }
    if(progress.ts!==undefined&&(typeof progress.ts!=='number'||!Number.isFinite(progress.ts)||progress.ts<0))throw new Error('保存时间错误');
    if(progress.u!==undefined){
      if(!progress.u||typeof progress.u!=='object'||Array.isArray(progress.u))throw new Error('时间记录错误');
      for(const field of ['d','w','s','m','n']){
        const times=progress.u[field];
        if(times===undefined)continue;
        if(!times||typeof times!=='object'||Array.isArray(times))throw new Error('时间记录错误');
        for(const [id,time] of Object.entries(times))if(!ids.has(id)||typeof time!=='number'||!Number.isFinite(time)||time<0)throw new Error('时间记录错误');
      }
    }
  }
  if(j.images!==undefined&&(!j.images||typeof j.images!=='object'||Array.isArray(j.images)))throw new Error('图片结构错误');
  if(j.views!==undefined&&(!j.views||typeof j.views!=='object'||Array.isArray(j.views)))throw new Error('浏览位置结构错误');
  if(j.currentBank!==undefined&&!BANKS.some(b=>b.id===j.currentBank))throw new Error('当前题库编号错误');
  return banks;
}
function validBackupViews(backup){
  const views={};
  const source=backup.views||{};
  for(const bank of BANKS){
    const view=source[bank.id];
    if(!view||typeof view!=='object'||Array.isArray(view))continue;
    const questionIds=new Set();
    bank.src().chapters.forEach((chapter,chapterIndex)=>chapter.items.forEach(item=>{
      questionIds.add(`${chapterIndex}|${item.t}|${item.n}`);
    }));
    const total=bank.src().chapters.reduce((count,chapter)=>count+chapter.items.length,0);
    const normalized={
      view:view.view||'ch',
      ch:view.ch===undefined?0:Number(view.ch),
      filter:view.filter||'all',
      idx:view.idx===undefined?0:Number(view.idx),
      order:view.order||'seq',
      seed:view.seed===undefined?1:Number(view.seed),
      currentId:view.currentId===undefined?null:view.currentId
    };
    if(!['ch','wrong','star','mark','note'].includes(normalized.view))continue;
    if(!Number.isInteger(normalized.ch)||normalized.ch<0||normalized.ch>=bank.src().chapters.length)continue;
    if(!FILTERS.some(filter=>filter[0]===normalized.filter))continue;
    if(!Number.isInteger(normalized.idx)||normalized.idx<0||normalized.idx>total)continue;
    if(!['seq','rand'].includes(normalized.order))continue;
    if(!Number.isInteger(normalized.seed)||normalized.seed<1)continue;
    if(normalized.currentId!==null&&(!questionIds.has(normalized.currentId)||typeof normalized.currentId!=='string'))continue;
    views[bank.id]=normalized;
  }
  return views;
}
$('bBackup').onclick=async()=>{
  const date=new Date();
  const pad=value=>String(value).padStart(2,'0');
  const name=`anatomy-backup-${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}.json`;
  save();
  const banks={};
  const views={};
  for(const bank of BANKS){
    const progress=LOADED_BANKS.has(bank.id)?MEM[bank.id]:lsGet(bank.key);
    const view=bank.id===BANK.id?V:(MEM_VIEWS[bank.id]||lsGet(bank.vkey));
    if(progress)banks[bank.id]=progress;
    if(view)views[bank.id]=view;
  }
  banks[BANK.id]=S;
  const bankSnapshot=JSON.parse(JSON.stringify(banks));
  const viewSnapshot=JSON.parse(JSON.stringify(views));
  const currentBank=BANK.id;
  const imageIds=new Set();
  for(const progress of Object.values(bankSnapshot)){
    for(const note of Object.values(progress.n||{})){
      if(typeof note!=='string')continue;
      for(const match of note.matchAll(/\(img:([A-Za-z0-9_-]+)\)/g))imageIds.add(match[1]);
    }
  }

  const images={};
  let missingImages=0;
  if(imageIds.size)syncMsg('正在打包图片…');
  for(const id of imageIds){
    try{
      const image=await imgGet(id);
      if(image)images[id]=await blobToData(image);
      else missingImages++;
    }catch(error){
      missingImages++;
    }
  }

  const backup={app:'anat-quiz',v:4,saved:date.toISOString(),currentBank,
    banks:bankSnapshot,views:viewSnapshot,images};
  const blob=new Blob([JSON.stringify(backup,null,1)],{type:'application/json'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  syncMsg(`已下载备份文件：${name}（含图片 ${Object.keys(images).length} 张${missingImages?'，'+missingImages+' 张不在本机':''}）`);
};
$('bRestore').onclick=()=>$('restoreFile').click();
$('restoreFile').onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const backup=JSON.parse(reader.result);
      const banks=backupBanks(backup);
      const views=validBackupViews(backup);
      let imageCount=0;

      for(const [id,dataUrl] of Object.entries(backup.images||{})){
        if(!/^[A-Za-z0-9_-]{1,100}$/.test(id))continue;
        const image=dataImageBlob(dataUrl);
        if(!image)continue;
        try{
          if(imgURL[id]){
            URL.revokeObjectURL(imgURL[id]);
            delete imgURL[id];
          }
          await imgPut(id,image);
          imageCount++;
        }catch(error){
          // 一张图片导入失败时，继续恢复其它记录。
        }
      }

      let recordCount=0;
      let noteCount=0;
      for(const bank of BANKS){
        const rawProgress=banks[bank.id];
        if(!rawProgress)continue;
        const backupTime=Date.parse(backup.saved)||0;
        const incoming={...rawProgress,ts:Number(rawProgress.ts||backupTime)};
        const current=LOADED_BANKS.has(bank.id)
          ? MEM[bank.id]
          : lsGet(bank.key);
        const empty={d:{},w:{},s:{},m:{},n:{},u:{},ts:0};
        const merged=mergeProgress(current||empty,incoming);
        merged.ts=Math.max(Date.now(),Number(merged.ts||0)+1);
        MEM[bank.id]=merged;
        LOADED_BANKS.add(bank.id);
        lsSet(bank.key,merged);
        recordCount+=Object.keys(incoming.d||{}).length;
        noteCount+=Object.values(incoming.n||{}).filter(Boolean).length;
      }

      for(const bank of BANKS){
        const view=views[bank.id];
        if(!view)continue;
        MEM_VIEWS[bank.id]=view;
        lsSet(bank.vkey,view);
      }

      const restoreBank=BANKS.find(bank=>bank.id===backup.currentBank)||BANK;
      if(MEM[BANK.id])S=MEM[BANK.id];
      useBank(restoreBank);
      syncMsg(`已合并恢复：做题记录 ${recordCount} 条，注释 ${noteCount} 条，图片 ${imageCount} 张。较新的本机记录和取消状态已保留。`);
    }catch(error){
      syncMsg('这个文件不是刷题本的备份');
    }finally{
      e.target.value='';
    }
  };
  reader.readAsText(file,'utf-8');
};

document.addEventListener('keydown',e=>{
  if(!$('lightbox').hidden){if(e.key==='Escape')$('lightbox').hidden=true;return}
  if(!$('viewer').hidden){if(e.key==='Escape')$('viewer').hidden=true;return}
  if(!$('exp').hidden){if(e.key==='Escape')$('exp').hidden=true;return}
  if(e.target.id==='noteTa'&&e.key==='Escape'){closeNoteEditor();return}
  if(e.target.closest('input,textarea'))return;
  const it=list[V.idx];if(!it)return;
  const k=e.key.toUpperCase();
  if(it.t==='判断题'&&judged===null&&['1','2','Y','N'].includes(k)){pick=new Set([k==='1'||k==='Y'?'√':'×']);judge();return}
  if(it.t==='判断题'&&e.key==='Enter'){e.preventDefault();go(1);return}
  let l=null;if('ABCDE'.includes(k)&&k.length===1)l=k;else if('12345'.includes(k)&&k.length===1)l=L[+k-1];
  if(l&&CHOICE[it.t]&&judged===null&&l.charCodeAt(0)-65<it.o.length){e.preventDefault();if(it.t==='X'){pick.has(l)?pick.delete(l):pick.add(l);renderStage()}else{pick=new Set([l]);judge()}return}
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Enter'){e.preventDefault();if(CHOICE[it.t]&&judged===null&&pick.size)judge();else go(1)}
  else if(e.key===' '&&!CHOICE[it.t]&&it.t!=='判断题'&&!revealed){e.preventDefault();revealed=true;renderStage()}
});
load().catch(()=>{$('stage').innerHTML='<div class="empty"><h2>题库没有载入</h2><p>刷新页面再试一次。</p></div>'});
</script>
